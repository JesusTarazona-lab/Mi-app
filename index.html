<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Hábitos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#0f0f14">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c5ce7'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f0f14;
    --card:#1a1a22;
    --card2:#24242f;
    --text:#f2f2f5;
    --muted:#8a8a96;
    --accent:#6c5ce7;
    --accent2:#a29bfe;
    --danger:#ff6b6b;
    --border:#2a2a35;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    height:100%;
    overscroll-behavior:none;
  }
  #app{
    max-width:600px; margin:0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px;
  }
  h1{font-size:28px; font-weight:800; margin:0;}
  header .icon-btn{
    background:var(--card); border:1px solid var(--border); color:var(--accent2);
    width:40px; height:40px; border-radius:50%; font-size:19px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .habit{
    background:var(--card); border-radius:18px; padding:16px;
    margin-bottom:14px; border:1px solid var(--border);
  }
  .habit-top{
    display:flex; align-items:center; gap:12px; margin-bottom:12px;
  }
  .habit-icon{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .habit-info{flex:1; min-width:0;}
  .habit-name{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .habit-streak{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .check{
    width:36px; height:36px; border-radius:50%; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer; font-size:17px; font-weight:700; transition:.15s;
    background:var(--card2); color:transparent;
  }
  .check.done{color:white;}

  .grid-wrap{overflow-x:auto; padding-bottom:2px;}
  .grid{
    display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 10px);
    gap:3px; width:max-content;
  }
  .cell{
    width:10px; height:10px; border-radius:3px; background:var(--card2);
    cursor:pointer;
  }
  .cell.future{visibility:hidden; cursor:default;}
  .cell.today-outline{box-shadow:inset 0 0 0 1.5px var(--accent2);}

  .empty{
    text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; line-height:1.6;
  }

  .fab{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); right:20px;
    width:58px; height:58px; border-radius:50%; background:var(--accent);
    color:white; font-size:28px; border:none; box-shadow:0 6px 18px rgba(108,92,231,.5);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-width:600px;
    border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    animation:up .2s ease-out;
  }
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet h2{margin:0 0 16px; font-size:18px;}
  .field-label{font-size:12.5px; color:var(--muted); margin:14px 0 8px; font-weight:600;}
  .field-label:first-of-type{margin-top:0;}
  .sheet input{
    width:100%; background:var(--card2); border:1px solid var(--border);
    color:var(--text); padding:14px; border-radius:12px; font-size:16px;
  }
  .name-row{display:flex; gap:10px;}
  .name-row input#habitIcon{width:60px; text-align:center; flex-shrink:0; font-size:20px; padding:14px 0;}
  .name-row input#habitName{flex:1;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{
    width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{border-color:white;}
  .row-btns{display:flex; gap:10px; margin-top:18px;}
  .row-btns button{
    flex:1; padding:14px; border-radius:12px; border:none;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:white;}
  .btn-secondary{background:var(--card2); color:var(--text);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger)!important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Hábitos</h1>
    <div class="icon-btn" onclick="openSheet()">+</div>
  </header>
  <div id="list"></div>
</div>

<button class="fab" onclick="openSheet()">+</button>

<div class="sheet-overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h2 id="sheetTitle">Nuevo hábito</h2>

    <div class="field-label">Ícono y nombre</div>
    <div class="name-row">
      <input id="habitIcon" placeholder="🏃" maxlength="2">
      <input id="habitName" placeholder="Nombre (ej. Leer 10 min)" maxlength="40">
    </div>

    <div class="field-label">Color</div>
    <div class="swatches" id="swatches"></div>

    <div class="row-btns">
      <button class="btn-secondary" onclick="closeSheet()">Cancelar</button>
      <button class="btn-primary" onclick="saveHabit()">Guardar</button>
    </div>
    <div class="row-btns" id="deleteRow" style="display:none">
      <button class="btn-danger" onclick="deleteHabit()">Eliminar hábito</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'habitTrackerData_v2';
const OLD_KEY = 'habitTrackerData_v1';
const COLORS = ['#2ecc90','#9b6bff','#ff6b6b','#ffa94d','#4d9fff','#ff6bcb','#ffd43b','#51cf66'];
const WEEKS = 20;

let state = load();
let editingId = null;
let selectedColor = COLORS[0];

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    const old = localStorage.getItem(OLD_KEY);
    if(old){
      const parsed = JSON.parse(old);
      parsed.habits.forEach((h,i)=>{ h.color = COLORS[i % COLORS.length]; h.icon = h.name[0].toUpperCase(); });
      return parsed;
    }
  }catch(e){}
  return { habits: [] }; // {id,name,icon,color,createdAt,log:{'2026-08-17':true}}
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function todayStr(d=new Date()){
  const nd = new Date(d);
  nd.setHours(0,0,0,0);
  return nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
}
function calcStreak(habit){
  let streak = 0;
  let d = new Date();
  if(!habit.log[todayStr(d)]) d.setDate(d.getDate()-1);
  while(habit.log[todayStr(d)]){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function toggleDate(habitId, dateStr){
  const h = state.habits.find(x=>x.id===habitId);
  if(!h) return;
  if(h.log[dateStr]) delete h.log[dateStr];
  else h.log[dateStr] = true;
  save();
  render();
}

function buildGrid(habit){
  const today = new Date(); today.setHours(0,0,0,0);
  const currentWeekStart = new Date(today);
  currentWeekStart.setDate(today.getDate() - today.getDay());
  const gridStart = new Date(currentWeekStart);
  gridStart.setDate(gridStart.getDate() - (WEEKS-1)*7);

  let cells = '';
  for(let w=0; w<WEEKS; w++){
    for(let d=0; d<7; d++){
      const date = new Date(gridStart);
      date.setDate(date.getDate() + w*7 + d);
      const dStr = todayStr(date);
      const isFuture = date > today;
      const isToday = dStr === todayStr(today);
      const done = !!habit.log[dStr];
      const bg = done ? habit.color : 'var(--card2)';
      cells += `<div class="cell ${isFuture?'future':''} ${isToday?'today-outline':''}"
        style="background:${bg}" ${isFuture?'':`onclick="toggleDate('${habit.id}','${dStr}')"`}></div>`;
    }
  }
  return cells;
}

function openSheet(id=null){
  editingId = id;
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('sheetTitle');
  const nameInput = document.getElementById('habitName');
  const iconInput = document.getElementById('habitIcon');
  const deleteRow = document.getElementById('deleteRow');

  document.getElementById('swatches').innerHTML = COLORS.map(c=>
    `<div class="swatch" style="background:${c}" data-color="${c}" onclick="pickColor('${c}')"></div>`
  ).join('');

  if(id){
    const h = state.habits.find(x=>x.id===id);
    title.textContent = 'Editar hábito';
    nameInput.value = h.name;
    iconInput.value = h.icon || '';
    selectedColor = h.color;
    deleteRow.style.display = 'flex';
  } else {
    title.textContent = 'Nuevo hábito';
    nameInput.value = '';
    iconInput.value = '';
    selectedColor = COLORS[state.habits.length % COLORS.length];
    deleteRow.style.display = 'none';
  }
  pickColor(selectedColor);
  overlay.classList.add('open');
  setTimeout(()=>nameInput.focus(), 100);
}
function pickColor(c){
  selectedColor = c;
  document.querySelectorAll('.swatch').forEach(s=>{
    s.classList.toggle('selected', s.dataset.color === c);
  });
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}
function saveHabit(){
  const name = document.getElementById('habitName').value.trim();
  const icon = document.getElementById('habitIcon').value.trim();
  if(!name) return;
  if(editingId){
    const h = state.habits.find(x=>x.id===editingId);
    h.name = name;
    h.icon = icon || name[0].toUpperCase();
    h.color = selectedColor;
  } else {
    state.habits.push({
      id: Date.now().toString(),
      name,
      icon: icon || name[0].toUpperCase(),
      color: selectedColor,
      createdAt: todayStr(),
      log:{}
    });
  }
  save();
  closeSheet();
  render();
}
function deleteHabit(){
  if(!editingId) return;
  state.habits = state.habits.filter(x=>x.id!==editingId);
  save();
  closeSheet();
  render();
}

function render(){
  const list = document.getElementById('list');
  if(state.habits.length===0){
    list.innerHTML = `<div class="empty">Todavía no tienes hábitos.<br>Toca + para agregar el primero.</div>`;
    return;
  }
  const today = todayStr();
  list.innerHTML = state.habits.map(h=>{
    const done = !!h.log[today];
    const streak = calcStreak(h);
    return `
      <div class="habit">
        <div class="habit-top">
          <div class="habit-icon" style="background:${h.color}33; color:${h.color}">${escapeHtml(h.icon)}</div>
          <div class="habit-info" onclick="openSheet('${h.id}')">
            <div class="habit-name">${escapeHtml(h.name)}</div>
            <div class="habit-streak">${streak>0 ? '🔥 '+streak+' día'+(streak===1?'':'s')+' seguidos' : 'Sin racha activa'}</div>
          </div>
          <div class="check ${done?'done':''}" style="${done?`background:${h.color};border-color:${h.color}`:''}" onclick="toggleDate('${h.id}','${today}')">✓</div>
        </div>
        <div class="grid-wrap"><div class="grid">${buildGrid(h)}</div></div>
      </div>`;
  }).join('');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
